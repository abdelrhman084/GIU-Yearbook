<!-- FILE: components/header/header.html -->
<header class="header">
  <!-- STEP 1: The 4px German tricolor on top (black, red, gold).
       aria-hidden: it is decoration, so screen readers skip it. -->
  <div class="tricolor" aria-hidden="true">
    <span class="band band--ink"></span>
    <span class="band band--red"></span>
    <span class="band band--gold"></span>
  </div>

  <div class="header__inner">
    <!-- STEP 2: Logo + title. The whole block links to the home page. -->
    <a class="brand" routerLink="/" aria-label="GIU Yearbook, go to home">
      @if (!logoFailed()) {
        <!-- (error) runs if the file is missing.
             TIP: export the logo from Figma and save it as
             public/images/giu-logo.png -->
        <img class="brand__logo" src="images/giu-logo.png"
             alt="German International University" (error)="logoFailed.set(true)">
      } @else {
        <span class="brand__fallback">GIU</span>
      }
      <span class="brand__text">
        <strong>German International University</strong>
        <small>YEARBOOK / 2028</small>
      </span>
    </a>

    <!-- STEP 3: Navigation. @for repeats the <a> once per item in navLinks.
         `track link.path` helps Angular know which item is which.
         COMMON MISTAKE: forgetting `track` is a compile error. -->
    <nav class="nav" aria-label="Main">
      @for (link of navLinks; track link.path) {
        <a class="nav__link" [routerLink]="link.path"
           routerLinkActive="nav__link--active"
           [routerLinkActiveOptions]="{ exact: link.exact }">
          {{ link.label }}
        </a>
      }
    </nav>

    <!-- STEP 4: The saved count and the login button sit together in the
         third column. saved.count() reads the shared service signal, so the
         number updates whenever a heart is toggled on any card. -->
    <div class="header__actions">
      <p class="header__saved" aria-live="polite">
        Saved <span class="header__count">{{ saved.count() }}</span>
      </p>

      @if (auth.currentUser()) {
        <a class="btn header__login" routerLink="/profile">
          My Profile
          <img src="icons/arrow-up-right.svg" alt="" aria-hidden="true" />
        </a>
      } @else {
        <a class="btn header__login" routerLink="/login">
          Student login
          <img src="icons/arrow-up-right.svg" alt="" aria-hidden="true" />
        </a>
      }
    </div>
  </div>
</header>
